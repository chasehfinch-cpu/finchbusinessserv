<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finch Business Services</title>
  <meta name="robots" content="noindex" />
  <script>
    // GitHub Pages SPA fallback. Stash the requested path so the home page
    // can replay it via history.replaceState, preserving the clean URL.
    (function () {
      try {
        sessionStorage.setItem("fbs:redirect", window.location.pathname + window.location.search);
      } catch (_) {}
      window.location.replace("/");
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/" />
</head>
<body>
  <p>Redirecting&hellip; <a href="/">Return home</a>.</p>
</body>
</html>
